name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # правки документации сборку не запускают
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    # arm64 собирается и тестируется на родной машине, кросс-сборка не дала бы запустить тесты
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      # подпись включается, когда в настройках репозитория заданы переменные SignPath
      SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        shell: pwsh
        run: |
          # версия из тега vX.Y.Z, для обычных сборок из последнего тега
          if ($env:GITHUB_REF -like 'refs/tags/v*') { "NR_VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_ENV }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/deepfilter/target
          key: deepfilter-${{ matrix.arch }}-${{ hashFiles('native/deepfilter/Cargo.lock', 'native/deepfilter/src/**') }}

      - name: Models
        shell: pwsh
        run: |
          ./tools/fetch-rnnoise.ps1
          ./tools/build-deepfilter.ps1

      - name: Native build and tests
        shell: pwsh
        run: |
          cmd /c native\build.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          ./build/resampler_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Resampler tests failed' }
          ./build/processor_test.exe (Resolve-Path build/rnnoise.dll).Path
          if ($LASTEXITCODE -ne 0) { throw 'Processor tests failed' }
          ./build/apo_test.exe (Resolve-Path build/NoiseReduction.Apo.dll).Path
          if ($LASTEXITCODE -ne 0) { throw 'APO tests failed' }
          ./build/control_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Control tests failed' }
          ./build/windows_control_test.exe (Resolve-Path build/NoiseReduction.Apo.dll).Path
          if ($LASTEXITCODE -ne 0) { throw 'Windows control tests failed' }

      - name: Integration tests
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $csc /nologo /platform:$(if ('${{ matrix.arch }}' -eq 'arm64') { 'anycpu' } else { 'x64' }) /warnaserror+ /r:System.ServiceProcess.dll /out:build\IntegrationTests.exe platform\Integration.cs platform\IntegrationTests.cs
          if ($LASTEXITCODE -ne 0) { throw 'Integration test compilation failed' }
          ./build/IntegrationTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Integration tests failed' }

      - name: Translations
        run: python tools/check-translations.py
        env:
          PYTHONIOENCODING: utf-8

      - name: App
        shell: pwsh
        run: ./tools/build-winui.ps1

      # подпись 1: свои exe и dll; чужие (.NET, Windows App SDK, MSVC, rnnoise) уже подписаны авторами или не наши
      - name: Collect binaries for signing
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signing/binaries | Out-Null
          Copy-Item build/NoiseReduction.Apo.dll, build/nr_deepfilter.dll, dist/app/NoiseReduction.exe, dist/app/NoiseReduction.dll, dist/app/NoiseReduction.Engine.exe -Destination signing/binaries

      - name: Upload binaries for signing
        id: binaries
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries-${{ matrix.arch }}
          path: signing/binaries

      - name: Sign binaries
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.binaries.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/binaries

      - name: Use signed binaries
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          Copy-Item signed/binaries/NoiseReduction.Apo.dll, signed/binaries/nr_deepfilter.dll -Destination build -Force
          Copy-Item signed/binaries/* -Destination dist/app -Force

      # подпись 2: каталог пакета эффектов, собранный уже из подписанных файлов
      - name: Effect pack
        shell: pwsh
        run: |
          if ($env:SIGNING -eq 'true') { ./tools/build-pack.ps1 -Unsigned } else { ./tools/build-pack.ps1 }

      - name: Upload catalog for signing
        id: catalog
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-catalog-${{ matrix.arch }}
          path: build/pack/NoiseReductionPack.cat

      - name: Sign catalog
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: catalog
          github-artifact-id: ${{ steps.catalog.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/catalog

      - name: Use signed catalog
        if: env.SIGNING == 'true'
        shell: pwsh
        run: Copy-Item signed/catalog/NoiseReductionPack.cat -Destination build/pack -Force

      # подпись 3: сам установщик, внутри которого уже лежит всё подписанное
      - name: Installer
        shell: pwsh
        run: ./tools/build-installer.ps1 -PackReady

      - name: Upload installer for signing
        id: installer
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ matrix.arch }}
          path: dist/setup/NoiseReduction.Setup.exe

      - name: Sign installer
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/installer

      - name: Use signed installer
        if: env.SIGNING == 'true'
        shell: pwsh
        run: Copy-Item signed/installer/NoiseReduction.Setup.exe -Destination dist/setup -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NoiseReduction.Setup-${{ matrix.arch }}
          path: dist/setup/NoiseReduction.Setup.exe

  # публикация отдельно: только ей нужно право записи в репозиторий
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: NoiseReduction.Setup-*
      - name: Files
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in x64 arm64; do
            mv "NoiseReduction.Setup-$arch/NoiseReduction.Setup.exe" "NoiseReduction-$version-$arch-setup.exe"
          done
          sha256sum NoiseReduction-*.exe > SHA256SUMS.txt
      # без сертификата хотя бы можно проверить, что установщик собран здесь из этого репозитория
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: NoiseReduction-*-setup.exe
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            NoiseReduction-*-setup.exe
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Installers:
            - `x64-setup.exe` for PCs with Intel or AMD processors, Windows 10 2004 or newer
            - `arm64-setup.exe` for PCs with Snapdragon and other ARM processors, Windows 11

            Or install with `winget install crutch12.NoiseReduction`

            The installers are not code signed yet. Check a download with `gh attestation verify <file> --repo crutch12/noise-reduction`

  winget:
    needs: release
    runs-on: windows-latest
    # пока пакет не принят в winget-pkgs, обновлять там нечего, релиз от этого не ломаем
    continue-on-error: true
    steps:
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: crutch12.NoiseReduction
          installers-regex: '-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
